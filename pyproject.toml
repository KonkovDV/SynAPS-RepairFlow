[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "synaps-repairflow"
version = "0.1.0"
description = "Auditable repair-maintenance planning contour on SynAPS (MVP)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "SynAPS RepairFlow contributors" }]
keywords = [
  "maintenance",
  "scheduling",
  "TOIR",
  "repair",
  "operations-research",
  "constraint-programming",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "synaps @ git+https://github.com/KonkovDV/SynAPS.git@6178c93b705ff58be21fa74a98651883a2da1169",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.4",
  "ruff>=0.8",
  "mypy>=1.13",
  "jsonschema>=4.23",
  "hypothesis>=6.0",
]

[project.scripts]
repairflow = "repairflow.cli:main"

[project.urls]
Homepage = "https://github.com/KonkovDV/SynAPS-RepairFlow"
Repository = "https://github.com/KonkovDV/SynAPS-RepairFlow"
Upstream = "https://github.com/KonkovDV/SynAPS"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/repairflow"]

[tool.hatch.build.targets.wheel.force-include]
"src/repairflow" = "repairflow"

[tool.hatch.build.targets.sdist]
include = [
  "/src/repairflow",
  "/schemas",
  "/tests",
  "/benchmark",
  "/docs",
  "/tools",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/APPLICATION.md",
  "/CITATION.cff",
  "/SECURITY.md",
  "/pyproject.toml",
  "/requirements-lock.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 120
markers = [
  "slow: CP-SAT and full demo guards",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["repairflow"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["synaps", "synaps.*"]
ignore_missing_imports = true
