name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4.38.2
