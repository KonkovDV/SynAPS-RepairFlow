name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python -m mypy --strict src/repairflow
      - run: python tools/verify_schema.py

  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m "not slow"

  synaps-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python tools/verify_lock.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_pin_regression.py tests/test_contract.py

  demo-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m repairflow demo --out out
      - run: python tools/pack_evidence.py --out out/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: repairflow-mvp-evidence
          path: |
            out/
            out/evidence/

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m repairflow benchmark --out bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repairflow-benchmark
          path: bench/

  test-slow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m pytest -q -m slow || {
            status=$?
            if [ "$status" -eq 5 ]; then
              echo "No tests matched -m slow; treating empty slow suite as pass."
              exit 0
            fi
            exit "$status"
          }
