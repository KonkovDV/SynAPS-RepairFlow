name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      run_nightly:
        description: Run the uncapped fault campaign and upload its artifact
        required: false
        type: boolean
        default: false
      run_mutation:
        description: Run mutmut on the notary modules
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hashed lock
        run: |
          python tools/verify_lock.py --hashed-out "$RUNNER_TEMP/hashed.txt" --git-out "$RUNNER_TEMP/git.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/hashed.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/git.txt"
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python -m mypy --strict src/repairflow
      - run: python tools/verify_schema.py
      - run: python tools/export_schemas.py

  test-fast:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hashed lock
        run: |
          python tools/verify_lock.py --hashed-out "$RUNNER_TEMP/hashed.txt" --git-out "$RUNNER_TEMP/git.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/hashed.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/git.txt"
      - run: python -m pytest -q -m "not slow"

  synaps-pin:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hashed lock
        run: |
          python tools/verify_lock.py --hashed-out "$RUNNER_TEMP/hashed.txt" --git-out "$RUNNER_TEMP/git.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/hashed.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/git.txt"
      - run: python -m pytest -q tests/test_pin_regression.py tests/test_contract.py tests/test_lock_hashes.py

  demo-evidence:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hashed lock
        run: |
          python tools/verify_lock.py --hashed-out "$RUNNER_TEMP/hashed.txt" --git-out "$RUNNER_TEMP/git.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/hashed.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/git.txt"
      - run: python -m repairflow demo --out out
      - run: python tools/pack_evidence.py --out out/evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repairflow-mvp-evidence
          path: |
            out/
            out/evidence/

  benchmark:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hashed lock
        run: |
          python tools/verify_lock.py --hashed-out "$RUNNER_TEMP/hashed.txt" --git-out "$RUNNER_TEMP/git.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/hashed.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/git.txt"
      - run: python -m repairflow benchmark --out bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repairflow-benchmark
          path: bench/

  test-slow:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'slow'))
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hashed lock
        run: |
          python tools/verify_lock.py --hashed-out "$RUNNER_TEMP/hashed.txt" --git-out "$RUNNER_TEMP/git.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/hashed.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/git.txt"
      - run: python -m pytest -q -m slow
      - name: Nightly fault campaign
        if: >-
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_nightly == true)) &&
          always()
        run: python -c "from pathlib import Path; from tests.fault_campaign import write_nightly; write_nightly(Path('out/fault-campaign-nightly.json'))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: >-
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_nightly == true)) &&
          always()
        with:
          name: fault-campaign-nightly
          path: out/fault-campaign-nightly.json

  mutation:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_mutation == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the hashed lock
        run: |
          python tools/verify_lock.py --hashed-out "$RUNNER_TEMP/hashed.txt" --git-out "$RUNNER_TEMP/git.txt"
          python -m pip install --require-hashes -r "$RUNNER_TEMP/hashed.txt"
          python -m pip install --no-deps -r "$RUNNER_TEMP/git.txt"
      - run: python -m pip install mutmut==3.8.0
      - run: mutmut run
      - name: Write mutmut summary
        if: always()
        run: mutmut results > mutmut-results.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutmut-results
          path: |
            mutmut-results.txt
            mutants/

  wheelhouse:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download hashed wheels and build the two project wheels
        run: |
          python tools/verify_lock.py --hashed-out "$RUNNER_TEMP/hashed.txt" --git-out "$RUNNER_TEMP/git.txt"
          python -m pip download --require-hashes -r "$RUNNER_TEMP/hashed.txt" -d wheelhouse
          python -m pip install --no-index --find-links wheelhouse --require-hashes -r "$RUNNER_TEMP/hashed.txt"
          python -m pip wheel --no-deps --no-build-isolation -r "$RUNNER_TEMP/git.txt" -w wheelhouse
          python -m pip wheel --no-deps --no-build-isolation . -w wheelhouse
          python -c "import pathlib; wheels=list(pathlib.Path('wheelhouse').glob('synaps-*.whl')); assert len(wheels)==1, wheels; project=list(pathlib.Path('wheelhouse').glob('synaps_repairflow-*.whl')); assert len(project)==1, project"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repairflow-wheelhouse
          path: wheelhouse/

  offline-demo:
    needs: wheelhouse
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: repairflow-wheelhouse
          path: wheelhouse
      - name: Install from the wheelhouse and run demo
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python tools/verify_lock.py --hashed-out "$RUNNER_TEMP/hashed.txt" --git-out "$RUNNER_TEMP/git.txt"
          python -m pip install --no-index --find-links wheelhouse --no-cache-dir --require-hashes -r "$RUNNER_TEMP/hashed.txt"
          python -m pip install --no-index --no-cache-dir --no-deps wheelhouse/synaps-*.whl
          python -m pip install --no-index --no-cache-dir --no-deps wheelhouse/synaps_repairflow-*.whl
          python -m repairflow demo --out out

  offline-image:
    needs: wheelhouse
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: repairflow-wheelhouse
          path: wheelhouse
      - name: Build from the local wheelhouse and run version offline
        run: |
          docker pull python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
          docker build --pull=false --network none -t repairflow:lab .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,mode=1777 repairflow:lab version

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
