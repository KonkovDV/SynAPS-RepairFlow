name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      run_nightly:
        description: Run the uncapped fault campaign and upload its artifact
        required: false
        type: boolean
        default: false
      run_mutation:
        description: Run mutmut on the notary modules
        required: false
        type: boolean
        default: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python -m mypy --strict src/repairflow
      - run: python tools/verify_schema.py
      - run: python tools/export_schemas.py

  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m "not slow"

  synaps-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python tools/verify_lock.py
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_pin_regression.py tests/test_contract.py

  demo-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m repairflow demo --out out
      - run: python tools/pack_evidence.py --out out/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: repairflow-mvp-evidence
          path: |
            out/
            out/evidence/

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m repairflow benchmark --out bench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repairflow-benchmark
          path: bench/

  test-slow:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'slow'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m slow
      - name: Nightly fault campaign
        if: >-
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_nightly == true)) &&
          always()
        run: python -c "from pathlib import Path; from tests.fault_campaign import write_nightly; write_nightly(Path('out/fault-campaign-nightly.json'))"
      - uses: actions/upload-artifact@v4
        if: >-
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_nightly == true)) &&
          always()
        with:
          name: fault-campaign-nightly
          path: out/fault-campaign-nightly.json

  mutation:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_mutation == true)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install mutmut==3.8.0
      - run: mutmut run
      - name: Write mutmut summary
        if: always()
        run: mutmut results > mutmut-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-results
          path: |
            mutmut-results.txt
            mutants/
